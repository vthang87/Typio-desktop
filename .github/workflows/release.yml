name: Release

# Runs when a pull request from dev is merged into main. Releases the version in Cargo.toml
# once, for macOS and Windows: bump it before merging to release again. Assets keep fixed
# names (Typio-macos.zip, Typio-windows.zip) so releases/latest/download/<name> always works.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version in Cargo.toml to release again." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Build macOS app
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Import signing certificate
        run: ./scripts/ci-import-cert.sh
        env:
          TYPIO_SIGN_P12: ${{ secrets.TYPIO_SIGN_P12 }}
          TYPIO_SIGN_P12_PASSWORD: ${{ secrets.TYPIO_SIGN_P12_PASSWORD }}
      - name: Build Typio.app (Apple silicon and Intel)
        run: ./scripts/bundle-macos.sh
        env:
          TYPIO_UNIVERSAL: "1"
          TYPIO_NO_INSTALL: "1"
      - name: Zip
        run: ditto -c -k --keepParent target/release/Typio.app "Typio-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Typio-macos.zip
          if-no-files-found: error

  windows:
    name: Build Windows app
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build Typio.exe
        run: cargo build --release -p typio-app
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Typio | Out-Null
          Copy-Item target/release/typio-app.exe dist/Typio/Typio.exe
          Compress-Archive -Path dist/Typio -DestinationPath "Typio-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Typio-windows.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Typio ${{ needs.version.outputs.version }}" \
            --generate-notes
