name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Import signing certificate
        run: ./scripts/ci-import-cert.sh
        env:
          TYPIO_SIGN_P12: ${{ secrets.TYPIO_SIGN_P12 }}
          TYPIO_SIGN_P12_PASSWORD: ${{ secrets.TYPIO_SIGN_P12_PASSWORD }}
      - name: Build Typio.app (Apple silicon and Intel)
        run: ./scripts/bundle-macos.sh
        env:
          TYPIO_UNIVERSAL: "1"
          TYPIO_NO_INSTALL: "1"
      - name: Zip
        run: ditto -c -k --keepParent target/release/Typio.app Typio-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Typio-macos
          path: Typio-macos.zip
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build Typio.exe
        run: cargo build --release -p typio-app
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Typio | Out-Null
          Copy-Item target/release/typio-app.exe dist/Typio/Typio.exe
          Compress-Archive -Path dist/Typio -DestinationPath Typio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Typio-windows
          path: Typio-windows.zip
          if-no-files-found: error
